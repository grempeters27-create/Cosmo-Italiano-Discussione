    <script>
      // Ignore HMR / Vite WebSocket transport errors per environment specification
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        var stack = (reason && reason.stack) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite') ||
          stack.includes('@vite/client') ||
          stack.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var filename = (event && event.filename) || '';
        if (
          msg.includes('WebSocket') ||
          filename.includes('@vite/client') ||
          msg.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-amber-50/40 text-stone-900 antialiased selection:bg-amber-200">
